name: Publication and frozen software checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python tools/verify_repository.py --without-raw-assets
      - run: python tools/check_release_assets.py --require-published
      - run: python tools/check_publication_scope.py
      - run: python tools/build_result_views.py --check
      - run: python tools/analyze_model_reviews.py --check
      - run: python -m unittest discover -s tests -v
      - run: python model_review/test_analysis.py
      - run: python tools/prepare_workspace.py --kind windows --destination work/windows
      - run: python -m unittest discover -s tests
        working-directory: work/windows
